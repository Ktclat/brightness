name: Build and release native Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v1.3.1
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build
        shell: msys2 {0}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build.ps1
      - name: Verify system-only DLL imports
        shell: msys2 {0}
        run: |
          set -euo pipefail
          objdump -p Brightness.exe | grep 'DLL Name:' | tee imports.txt
          if objdump -p Brightness.exe | grep 'DLL Name:' | grep -Eiv '(ADVAPI32|dxva2|KERNEL32|SHELL32|USER32)\.dll'; then
            echo 'Unexpected runtime dependency'
            exit 1
          fi
      - name: Package
        shell: pwsh
        run: |
          if ((Get-Item Brightness.exe).VersionInfo.FileVersion -ne '1.3.1') { throw 'Unexpected binary version' }
          $metadata = (Get-Item Brightness.exe).VersionInfo
          if ($metadata.FileDescription -ne 'Brightness' -or $metadata.ProductName -ne 'Brightness' -or $metadata.CompanyName -ne 'Ktclat') { throw 'Unexpected application identity' }
          $strings = [Text.Encoding]::Unicode.GetString([IO.File]::ReadAllBytes((Resolve-Path ./Brightness.exe)))
          foreach ($label in @('开机自启','默认亮度：%d%%','打开文件路径','删除启动注册信息','退出')) {
            if (!$strings.Contains($label)) { throw "Missing Simplified Chinese label: $label" }
          }
          ./Brightness.exe --remove-startup | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Startup cleanup smoke test failed' }
          ./package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; leaving it unchanged.'; exit 0 }
          gh release create $env:RELEASE_TAG ./dist/brightness-v1.3.1-windows-x64.zip ./dist/Brightness-v1.3.1-x64.exe ./dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Brightness v1.3.1' --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }


